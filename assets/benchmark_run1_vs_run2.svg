  <text x="40" y="155" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Django, Scikit-Learn, Pytest, Xarray, SymPy</text>
  
  <!-- Bar 1A (Run 1) -->
  <rect x="40" y="168" width="40" height="24" rx="4" fill="#F85149" opacity="0.5"/>
  <text x="90" y="185" fill="#F85149" font-family="monospace" font-size="13" font-weight="bold">0 Resolved (Blocked by Apply Errors)</text>
  
