name: 🥊 Kronumos SWE-bench Docker Evaluation

on:
  push:
    paths:
      - 'predictions.jsonl'
      - 'output/predictions.jsonl'
      - '.github/workflows/eval_docker.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      dataset_name:
        description: 'SWE-bench dataset split to evaluate'
        required: true
        default: 'SWE-bench/SWE-bench_Verified'
        type: choice
        options:
          - 'SWE-bench/SWE-bench_Verified'
          - 'SWE-bench/SWE-bench_Lite'
      predictions_file:
        description: 'Path to predictions.jsonl'
        required: true
        default: 'predictions.jsonl'

permissions:
  contents: write

jobs:
  docker-swebench-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group:
          - django
          - sympy
          - viz-docs
          - core-libs
          - utils-web

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🧹 Deep Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /opt/az /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          docker builder prune -a -f || true
          docker image prune -a -f || true
          df -h

      - name: 🛡️ Launch Background Docker Pruner Daemon
        run: |
          nohup bash scripts/docker_pruner.sh > /tmp/pruner.log 2>&1 &
          echo "Pruner daemon started in background (PID: $!)."

      - name: 🐳 Verify Docker Daemon
        run: |
          docker --version
          docker info

      - name: 📦 Install SWE-bench official harness
        run: |
          python -m pip install --upgrade pip
          pip install swebench datasets

      - name: 🔍 Partition Predictions for Group ${{ matrix.group }}
        run: |
          PRED_INPUT="${{ github.event.inputs.predictions_file || 'predictions.jsonl' }}"
          python3 scripts/partition_predictions.py \
            --input "$PRED_INPUT" \
            --group "${{ matrix.group }}" \
            --output "predictions_${{ matrix.group }}.jsonl"

      - name: 🚀 Run Official Docker SWE-bench Evaluation
        run: |
          DATASET="${{ github.event.inputs.dataset_name || 'SWE-bench/SWE-bench_Verified' }}"
          GROUP="${{ matrix.group }}"
          PRED_FILE="predictions_${GROUP}.jsonl"
          echo "Running SWE-bench official evaluation harness on $DATASET for group $GROUP..."
          
          mkdir -p "reports_${GROUP}"
          if [ ! -s "$PRED_FILE" ]; then
            echo "No predictions found for group $GROUP ($PRED_FILE is empty). Skipping evaluation."
            echo "{}" > "reports_${GROUP}/empty_report.json"
            exit 0
          fi
          
          python -m swebench.harness.run_evaluation \
            --dataset_name "$DATASET" \
            --predictions_path "$PRED_FILE" \
            --max_workers 2 \
            --run_id "kronumos_${GROUP}" \
            --report_dir "reports_${GROUP}"

      - name: 📦 Upload Group Results & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.group }}
          path: |
            reports_${{ matrix.group }}/
            *.json
            *.log
            logs/
            predictions_${{ matrix.group }}.jsonl

  aggregate-and-report:
    needs: docker-swebench-eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📥 Download all matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'results-*'
          path: downloaded_artifacts

      - name: 📊 Aggregate Final Scorecard Across All 500 Instances
        run: |
          python3 scripts/aggregate_scorecard.py \
            --input_dir downloaded_artifacts \
            --output_json kronumos_verified_500_final_report.json

      - name: 📦 Upload Final Unified Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronumos-verified-500-final-scorecard
          path: |
            kronumos_verified_500_final_report.json
